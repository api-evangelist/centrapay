                                      properties:
                                        type:
                                          type: string
                                        code:
                                          type: string
                                        name:
                                          type: string
                                        props:
                                          type: object
                  merchantId:
                    type: string
                    example: 5efbe17d96c083633e2b9241
                    description: The Centrapay merchant id.
                  merchantName:
                    type: string
                    example: NZD Test Merchant
                    description: The name of the merchant.
                  configId:
                    type: string
                    example: mc_5efbe2fb96c08357bb2b9242
                    description: The [Merchant Config](/api/merchant-configs) id used to configure the payment options.
                  status:
                    type: string
                    enum:
                    - new
                    - paid
                    - cancelled
                    - expired
                    description: 'Valid values: `new`, `paid`, `cancelled`, or `expired`.'
                  liveness:
                    type: string
                    enum:
                    - test
                    - main
                    description: Indicates liveness of assets that are accepted, determined by the payment options. Values are `main` or `test`.
                  createdAt:
                    type: string
                    format: date-time
                    example: '2023-10-23T22:56:46.145Z'
                    description: When the Payment Request was created.
                  updatedAt:
                    type: string
                    format: date-time
                    example: '2023-10-23T22:56:46.145Z'
                    description: When the Payment Request was updated.
                  expiresAt:
                    type: string
                    format: date-time
                    example: '2023-10-23T22:58:46.145Z'
                    description: When the Payment Request expires.
                  merchantConditions:
                    type: array
                    description: A dynamic list of [Payment Conditions](#payment-condition-model) that require operator approval to complete a payment. Conditions are calculated when [polling a Payment Request](#get-a-payment-request).
                    items:
                      x-title: Payment Condition Model
                      x-intro: 'Some [Asset Types](/api/asset-types) require conditional approval to pay. Possible Payment Conditions include confirming proof of ID

                        or confirming a promotional item was purchased.


                        The `conditionsEnabled` flag should be set to true when [Creating a Payment Request](#create-a-payment-request) to indicate that

                        Payment Conditions can be accepted. If a Payment Condition arises, the absence of the `conditionsEnabled` flag will result in the

                        Payment Request being cancelled.


                        Conditions can either be [accepted](#accept-a-payment-condition) or [declined](#decline-a-payment-condition). If a condition is declined,

                        the Payment Request will be cancelled.

                        '
                      type: object
                      properties:
                        id:
                          x-type: bignumber
                          type: string
                          description: An enumerated identifier for the Payment Condition.
                        name:
                          type: string
                          description: The name of the condition.
                        message:
                          type: string
                          description: The human-readable description of the condition.
                        status:
                          type: string
                          description: The status of the condition. Valid values include `accepted`, `declined`, `awaiting-merchant` or `void`.
                  remainingAmount:
                    x-type: bignumber
                    type: string
                    description: The amount of the Payment Request which has not been paid for.
                  patronCodeId:
                    type: string
                    description: The id of a [Patron Code](/api/patron-codes) the Payment Request is attached to.
                  barcode:
