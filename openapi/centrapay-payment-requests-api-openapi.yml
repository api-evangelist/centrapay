  /api/payment-requests/{paymentRequestId}/pay:
    post:
      x-method: POST
      x-path: /api/payment-requests/{paymentRequestId}/pay
      operationId: payPaymentRequest
      summary: Pay a Payment Request
      description: 'To pay a Payment Request you must supply the name of the Asset Type, `idempotencyKey` and one of `assetId`, `transactionId` or `authorization`.

        - Use `assetId` if the Asset Type is managed by Centrapay.

        - Use `transactionId` to verify an external transaction such as a Bitcoin payment.

        - Use `authorization` to authorize an external transaction.'
      tags:
      - payment-requests
      parameters:
      - name: paymentRequestId
        in: path
        required: true
        schema:
          type: string
        example: MhocUmpxxmgdHjr7DgKoKw
        description: The Payment Request id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assetType
              - idempotencyKey
              properties:
                assetType:
                  type: string
                  description: An [Asset Type](/api/asset-types) reference.
                idempotencyKey:
                  type: string
                  description: A unique identifier that prevents duplicate processing of the same request. See [idempotency](/api/idempotency).
                assetId:
                  type: string
                  description: The id of the Asset being used to make payment.
                transactionId:
                  type: string
                  description: Used to verify an external transaction eg Bitcoin.
                authorization:
                  type: string
                  description: Used to authorize an external transaction.
                mode:
                  type: string
                  description: The mode of payment. Valid values are `partial-payment` and `multi-asset-payment`.
                amount:
                  x-type: bignumber
                  type: string
                  description: The value required to pay using the canonical units for the Asset Type.
                externalPaymentRef:
                  type: string
                  description: An external reference to the payment. Required when `assetType` is `farmlands.nzd.*`.
                lineItems:
                  type: array
                  description: The [Line Items](#line-item-model) associated with this payment attempt. This field is only allowed for `centrapay.token.*` payments. If omitted for `centrapay.token.*` payments, the highest-value valid line item from the payment request will be used by default.
                  items:
                    x-title: Line Item Model
                    x-intro: 'An order item for which payment is requested.

                      The currency and units for a Line Item price will be consistent with the Payment Request value and the sum of Line Item prices should equal the Payment Request value.


                      Line items can include a discount amount.

                      A discount that applies to multiple Line Items may be represented as a separate Line Item with a negative amount.


