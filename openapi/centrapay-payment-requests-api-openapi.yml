                    currency: NZD
                  externalRef: e8df06e2-13a5-48b4-b670-3fd6d815fe0a
                  lineItems:
                  - name: Hard Hat
                    sku: GH1234
                    qty: '1'
                    price: '4000'
                    tax: '15'
                    discount: '400'
      responses:
        '200':
          description: Payment Request refund initiated
          content:
            application/json:
              schema:
                x-title: Payment Activity Model
                x-intro: 'A Payment Activity records a transaction that has happened on a Payment Request.

                  Payment Activities are created when a Payment Request has been `created`, `paid`, `refunded`, `cancelled`, or `expired`.

                  '
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier of the Payment Activity.
                  type:
                    type: string
                    description: The [Payment Activity Type](#payment-activity-types).
                  value:
                    x-type: monetary
                    type: object
                    description: The value of the Payment Activity. Must be less than 100000000 and positive.
                    properties:
                      amount:
                        type: string
                      currency:
                        type: string
                  paymentRequestId:
                    type: string
                    description: The Payment Request's id.
                  merchantId:
                    type: string
                    example: 5efbe17d96c083633e2b9241
                    description: The Centrapay merchant id.
                  merchantConfigId:
                    type: string
                    description: The Payment Request's [Merchant Config](/api/merchant-configs) id.
                  merchantAccountId:
                    type: string
