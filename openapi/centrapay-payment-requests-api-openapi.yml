openapi: 3.2.0
info:
  title: Centrapay Payment Requests API
  version: 1.0.0
  x-page:
    title: Payment Requests
    description: Payment request models and related endpoints
    nav:
      path: Payment Requests
      order: 1
    intro: 'Payment Requests represent the intention for a merchant to receive payment for goods and services. Payment Requests define the amount to be paid and the Asset Types that are acceptable for payment.


      A Payment Request is shared with, and paid by, a patron. The [Payment Flows Guide](/guides/payment-flows/) has more details regarding negotiation of Payment Requests.


      Payment Requests have the following statuses:

      - `new`: after being created.

      - `paid`: after being paid with one or more transactions.

      - `cancelled`: after being cancelled or voided by the merchant.

      - `expired`: after expiry time is reached without being paid or cancelled.


      Payment requests can also be refunded for a short period of time after being paid.


      Payment request state transitions can be notified to webhooks.

      '
    models:
    - payment-request
    - payment-option
    - accepted-collections
    - payment-condition
    - line-item
    - product-classification
    - paid-by
    - asset-totals
    - payment-activity
    - strategy
    extras:
    - title: Payment Activity Types
      depth: 3
      body: '|       Name        |                                                 Description                                                 |

        | ----------------- | ----------------------------------------------------------------------------------------------------------- |

        | request           | [Payment Request](#payment-request-model) was created.                                                      |

        | preAuthRequest    | [Payment Request](#payment-request-model) was created with the `preAuth` flag set to "true".                |

        | paid              | [Payment Request](#payment-request-model) was paid.                                                         |

        | payment           | A payment was made towards the [Payment Request](#payment-request-model).                                   |

        | refund            | Funds were returned to the shopper.                                                                         |

        | cancellation      | [Payment Request](#payment-request-model) was cancelled by the merchant or the shopper.                     |

        | expiry            | [Payment Request](#payment-request-model) wasn''t paid before time out.                                      |

        | accept-condition  | A [Payment Condition](#payment-condition-model) was accepted.                                               |

        | decline-condition | A [Payment Condition](#payment-condition-model) was declined.                                               |

        | authorization     | A Pre Auth [Payment Request](#payment-request-model) was approved and confirmations can be made against it. |

        | confirmation      | Funds on a Pre Auth have been drawn down on.                                                                |

        | release           | Pre Auth has been finalised and any remaining funds from Authorization have been returned.                  |

        '
    - title: Cancellation Reasons
      depth: 2
      body: '|            Reason            |                                                                                                     Description                                                                                                      |

        | ---------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |

        | CANCELLED_BY_MERCHANT        | The merchant cancelled the Payment Request by calling the cancel or void endpoint.                                                                                                                                   |

        | CANCELLED_BY_PATRON          | The patron cancelled the transaction.                                                                                                                                                                                |

        | PATRON_CODE_INVALID          | The patron code on the Payment Request was invalid.                                                                                                                                                                  |

        | PAYMENT_FAILED               | The Payment Request failed for an unknown reason.                                                                                                                                                                    |

        | PATRON_CODE_EXPIRED          | The patron code on the Payment Request has expired.                                                                                                                                                                  |

        | DECLINED_BY_PATRON           | The payment was declined by the patron during approval steps.                                                                                                                                                        |

        | DECLINED_BY_MERCHANT         | The payment was declined by the merchant during approval steps.                                                                                                                                                      |

        | PAYMENT_DECLINED             | The payment parameters were valid but payment was declined because additional payment restrictions were violated. For example, asset not active, asset overdrawn, quota exceeded or line item category restrictions. |

        | PAYMENT_REQUEST_EXPIRED      | The Payment Request has expired.                                                                                                                                                                                     |

        | NO_AVAILABLE_PAYMENT_OPTIONS | No payment options match the requested payment parameters.                                                                                                                                                           |

        | INACTIVE_ASSET               | The asset used to pay the Payment Request is inactive.                                                                                                                                                               |

        '
servers:
- url: https://service.centrapay.com
  description: Centrapay production API (host taken from the curl examples on https://docs.centrapay.com/api/payment-requests; the source spec declares no servers[])
tags:
- name: payment-requests
paths:
  /api/payment-requests:
    post:
      x-method: POST
      x-path: /api/payment-requests
      operationId: createPaymentRequest
      summary: Create a Payment Request
      description: This endpoint allows you to create a Payment Request for a given Merchant Config and value.
      tags:
      - payment-requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - configId
              - value
              properties:
                configId:
                  type: string
                  example: mc_5efbe2fb96c08357bb2b9242
                  description: The [Merchant Config](/api/merchant-configs) id used to configure the payment options.
                value:
                  x-type: monetary
                  type: object
                  description: The canonical value of the Payment Request. Must be less than 100000000 and positive.
                  properties:
                    amount:
                      type: string
                    currency:
                      type: string
                barcode:
                  type: string
                  description: '[Scanned Code](/api/scanned-codes) used to create the Payment Request. Required when the [Quick Pay](/guides/payment-flows/#quick-pay) payment flow is used.'
                barcodeType:
                  type: string
                  description: Indicates the provider of a barcode, e.g. `ticketek`.
                collectionId:
                  type: string
                  description: The identifier of the [Token Collection](/api/tokens).
                expirySeconds:
                  type: integer
                  description: The expiry seconds used to configure the Payment Request expiry.
                lineItems:
                  type: array
                  description: The [Line Items](#line-item-model) being paid for.
                  example:
                  - name: Hard Hat
                    sku: GH1234
                    qty: '1'
                    price: '4000'
                    tax: '15'
                    discount: '400'
                  - name: Tool Belt
                    sku: GH1234
                    qty: '1'
                    price: '6000'
                    tax: '15'
                    discount: '600'
                  items:
                    x-title: Line Item Model
                    x-intro: 'An order item for which payment is requested.

                      The currency and units for a Line Item price will be consistent with the Payment Request value and the sum of Line Item prices should equal the Payment Request value.


                      Line items can include a discount amount.

                      A discount that applies to multiple Line Items may be represented as a separate Line Item with a negative amount.


                      Either `price` or `unitPrice` must be supplied. If `price` is supplied it is used as-is; if only `unitPrice` is supplied, `price` is computed as `unitPrice * qty`. When both are supplied, `price` takes priority and is not validated against `unitPrice * qty`.

                      '
                    type: object
                    required:
                    - name
                    - qty
                    - price
                    properties:
                      name:
                        type: string
                        example: Hard Hat
                        description: The product description.
                      sku:
                        type: string
                        example: GH1234
                        description: The product (stock keeping unit) code. Required for [Token](/api/tokens/) redemptions.
                      qty:
                        x-type: bignumber
                        type: string
                        example: '1'
                        description: The product quantity (eg. item count, weight, volume etc).
                      unitMeasure:
                        type: string
                        example: kg
                        description: A free-text label describing the unit of `qty` (eg. kg, L, seat). Display only, maximum 20 characters.
                      price:
                        x-type: bignumber
                        type: string
                        example: '4000'
                        description: The total price in cents for the line item (eg. `price = product price * qty - discounts + tax`). Either `price` or `unitPrice` is required; if both are supplied, `price` takes priority.
                      unitPrice:
                        type: string
                        example: '4000'
                        description: The price of a single unit of `qty`, in cents. Used to compute `price` when `price` is not supplied.
                      tax:
                        x-type: bignumber
                        type: string
                        example: '15'
                        description: Tax rate (percentage).
                      discount:
                        x-type: bignumber
                        type: string
                        example: '400'
                        description: Discount amount in cents (tax exclusive).
                      metadata:
                        type: object
                        additionalProperties:
                          type: string
                        example:
                          color: red
                        description: A set of up to 20 key-value string pairs for storing additional structured information about the line item. Keys may be up to 40 characters; values up to 500 characters.
                      productId:
                        type: string
                        description: Manufacturer's product identifier (eg GTIN/EAN).
                      restricted:
                        type: boolean
                        description: Disallow payment with a “restricted” [Asset Type](/api/asset-types).
                      classification:
                        type: object
                        description: '[Product Classification](#product-classification).'
                        properties:
                          type:
                            type: string
                          code:
                            type: string
                          name:
                            type: string
                          props:
                            type: object
                purchaseOrderRef:
                  type: string
                  description: A reference to a purchase order for this Payment Request.
                invoiceRef:
                  type: string
                  description: A reference to an invoice for this Payment Request. Must be less than or equal to 128 characters.
                redirectCancelUrl:
                  type: string
                  x-experimental: true
                  description: URL to redirect the user to after they cancel the Payment Request. Must start with one of the allowedRedirectUrls for the [Merchant Config](/api/merchant-configs).
                redirectPaidUrl:
                  type: string
                  x-experimental: true
                  description: URL to redirect the user to after they pay the Payment Request. Must start with one of the allowedRedirectUrls for the [Merchant Config](/api/merchant-configs).
                externalRef:
                  type: string
                  description: An external reference to the Payment Request.
                terminalId:
                  type: string
                  description: The software or logical id of the payment terminal.
                deviceId:
                  type: string
                  description: The hardware id or serial number of the payment terminal.
                operatorId:
                  type: string
                  description: POS operator Id.
                createdByAccountName:
                  type: string
                  description: Name of the [Centrapay Account](/api/accounts) creating the Payment Request.
                conditionsEnabled:
                  type: boolean
                  description: Flag to indicate that a merchant is able to accept [Payment Conditions](#payment-condition-model).
                patronNotPresent:
                  type: boolean
                  description: Flag to indicate the patron is not physically present. This may affect payment conditions or available [Payment Options](#payment-option-model).
                preAuth:
                  type: boolean
                  description: Flag to indicate if the request is a Pre Auth for supported [Asset Types](/api/asset-types).
                partialAllowed:
                  type: boolean
                  description: Flag to indicate that the Payment Request can be paid for partially.
                basketAmount:
                  x-type: bignumber
                  type: string
                  description: The total amount of the transaction including non Centrapay payment methods. Required when `partialAllowed` is `true`.
                connectionId:
                  type: string
                  example: cn_9asd9k19
                  x-experimental: true
                  description: The identifier of the [Connection](/api/connections) associated with the payment request.
                paymentLinkId:
                  type: string
                  example: pl_5srt998b
                  x-experimental: true
                  description: The identifier of the [Payment Link](/api/payment-links).
            examples:
              default:
                value:
                  configId: mc_5efbe2fb96c08357bb2b9242
                  expirySeconds: 120
                  value:
                    amount: '10000'
                    currency: NZD
                  lineItems:
                  - name: Hard Hat
                    sku: GH1234
                    qty: '1'
                    price: '4000'
                    tax: '15'
                    discount: '400'
                  - name: Tool Belt
                    sku: GH1234
                    qty: '1'
                    price: '6000'
                    tax: '15'
                    discount: '600'
                  connectionId: cn_9asd9k19
                  paymentLinkId: pl_5srt998b
      responses:
        '200':
          description: Payment Request created
          content:
            application/json:
              schema:
                x-title: Payment Request Model
                type: object
                properties:
                  id:
                    type: string
                    example: VYowvZmuw3hbp1va9xqWx7
                    description: The Payment Request id.
                  shortCode:
                    type: string
                    example: CP-X4V-6N
                    description: A shorter id that can be used to identify the Payment Request for up to two years.
                  url:
                    type: string
                    example: https://app.centrapay.com/pay/VYowvZmuw3hbp1va9xqWx7
                    description: The URL for a Centrapay webpage that allows the user to pay the Payment Request.
                  value:
                    x-type: monetary
                    type: object
                    description: The canonical value of the Payment Request. Must be less than 100000000 and positive.
                    properties:
                      amount:
                        type: string
                      currency:
                        type: string
                  paymentOptions:
                    type: array
                    description: The [Payment Options](#payment-option-model), indicating valid asset for payment.
                    items:
                      x-title: Payment Option Model
                      x-outro: '⭐️ For Payment Options which specify an address, there''s a requirement to make a transaction on an external ledger. Once you have made that payment, you can use the transaction id to [Pay a Payment Request](#pay-a-payment-request).

                        '
                      type: object
                      properties:
                        assetType:
                          type: string
                          description: An [Asset Type](/api/asset-types) reference.
                        amount:
                          x-type: bignumber
                          type: string
                          description: The value required to pay using the canonical units for the Asset Type.
                        bitcoinAddress:
                          type: string
                          description: ⭐️ Address to send Bitcoin, when the `assetType` is `bitcoin.*`.
                        acceptedCollections:
                          type: array
                          description: '[Accepted Collections](#accepted-collections) for the Payment Request, when the “assetType” is `centrapay.token.*`.'
                          items:
                            x-title: Accepted Collections
                            x-intro: 'If a Payment Request contains a `centrapay.token.*` Payment Option, an array of Accepted Collections will be present inside the `centrapay.token` Payment Option.

                              The Accepted Collections returned can be used to determine if a [Centrapay Token](/api/tokens) can be used to pay a Payment Request, and the Line Items able to be purchased using the Token.

                              '
                            type: object
                            properties:
                              id:
                                type: string
                                description: The id of a collection that the Merchant accepts for the given Payment Request.
                              lineItems:
                                type: array
                                description: The [Line Items](#line-item-model) that can be purchased by a [Centrapay Token](/api/tokens) with matching collection id.
                                items:
                                  x-title: Line Item Model
                                  x-intro: 'An order item for which payment is requested.

                                    The currency and units for a Line Item price will be consistent with the Payment Request value and the sum of Line Item prices should equal the Payment Request value.


                                    Line items can include a discount amount.

