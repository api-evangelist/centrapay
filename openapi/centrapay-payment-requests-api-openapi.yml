  /api/payment-requests/{paymentRequestId}/refund:
    post:
      x-method: POST
      x-path: /api/payment-requests/{paymentRequestId}/refund
      operationId: refundPaymentRequest
      summary: Refund a Payment Request
      description: This endpoint allows you to initiate a refund of a Payment Request. The refund will be completed asynchronously.
      tags:
      - payment-requests
      parameters:
      - name: paymentRequestId
        in: path
        required: true
        schema:
          type: string
        example: MhocUmpxxmgdHjr7DgKoKw
        description: The Payment Request id.
