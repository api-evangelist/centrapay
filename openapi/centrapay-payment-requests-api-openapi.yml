                          type: array
                          description: '[Accepted Collections](#accepted-collections) for the Payment Request, when the “assetType” is `centrapay.token.*`.'
                          items:
                            x-title: Accepted Collections
                            x-intro: 'If a Payment Request contains a `centrapay.token.*` Payment Option, an array of Accepted Collections will be present inside the `centrapay.token` Payment Option.

                              The Accepted Collections returned can be used to determine if a [Centrapay Token](/api/tokens) can be used to pay a Payment Request, and the Line Items able to be purchased using the Token.

                              '
                            type: object
                            properties:
                              id:
                                type: string
                                description: The id of a collection that the Merchant accepts for the given Payment Request.
                              lineItems:
                                type: array
                                description: The [Line Items](#line-item-model) that can be purchased by a [Centrapay Token](/api/tokens) with matching collection id.
                                items:
                                  x-title: Line Item Model
                                  x-intro: 'An order item for which payment is requested.

                                    The currency and units for a Line Item price will be consistent with the Payment Request value and the sum of Line Item prices should equal the Payment Request value.


                                    Line items can include a discount amount.

                                    A discount that applies to multiple Line Items may be represented as a separate Line Item with a negative amount.


                                    Either `price` or `unitPrice` must be supplied. If `price` is supplied it is used as-is; if only `unitPrice` is supplied, `price` is computed as `unitPrice * qty`. When both are supplied, `price` takes priority and is not validated against `unitPrice * qty`.

                                    '
                                  type: object
                                  required:
                                  - name
                                  - qty
                                  - price
                                  properties:
                                    name:
                                      type: string
                                      example: Hard Hat
                                      description: The product description.
                                    sku:
                                      type: string
                                      example: GH1234
                                      description: The product (stock keeping unit) code. Required for [Token](/api/tokens/) redemptions.
                                    qty:
