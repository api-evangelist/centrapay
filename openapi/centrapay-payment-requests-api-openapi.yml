  /api/payment-requests/{paymentRequestId}:
    get:
      x-method: GET
      x-path: /api/payment-requests/{paymentRequestId}
      operationId: getPaymentRequest
      summary: Get a Payment Request
      description: This endpoint allows you to retrieve a Payment Request.
      tags:
      - payment-requests
      parameters:
      - name: paymentRequestId
        in: path
        required: true
        schema:
          type: string
        example: MhocUmpxxmgdHjr7DgKoKw
