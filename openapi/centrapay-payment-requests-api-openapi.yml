                      '
                    type: object
                    required:
                    - name
                    - qty
                    - price
                    properties:
                      name:
                        type: string
                        example: Hard Hat
                        description: The product description.
                      sku:
                        type: string
                        example: GH1234
                        description: The product (stock keeping unit) code. Required for [Token](/api/tokens/) redemptions.
                      qty:
                        x-type: bignumber
                        type: string
                        example: '1'
                        description: The product quantity (eg. item count, weight, volume etc).
                      unitMeasure:
                        type: string
                        example: kg
                        description: A free-text label describing the unit of `qty` (eg. kg, L, seat). Display only, maximum 20 characters.
                      price:
                        x-type: bignumber
                        type: string
                        example: '4000'
                        description: The total price in cents for the line item (eg. `price = product price * qty - discounts + tax`). Either `price` or `unitPrice` is required; if both are supplied, `price` takes priority.
                      unitPrice:
                        type: string
                        example: '4000'
                        description: The price of a single unit of `qty`, in cents. Used to compute `price` when `price` is not supplied.
                      tax:
                        x-type: bignumber
                        type: string
                        example: '15'
                        description: Tax rate (percentage).
                      discount:
                        x-type: bignumber
                        type: string
                        example: '400'
                        description: Discount amount in cents (tax exclusive).
                      metadata:
                        type: object
                        additionalProperties:
                          type: string
                        example:
                          color: red
